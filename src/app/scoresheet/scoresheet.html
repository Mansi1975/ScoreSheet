<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Score Sheet</title>
    <link rel="stylesheet" href="scoresheet.css">
</head>
<body>
    <div class="score-sheet">
        <h1>Score Sheet</h1>
        <p><strong>Judge:</strong></p>
        <p><strong>Startup:</strong></p>
        <p><strong>Eureka ID:</strong></p>
        <p><strong>Pitch deck - <input type="text" placeholder=""></strong></p>
        
        <div class="criteria">
            <div class="row">
                <span>Startup Idea and USP</span>
                <input type="text" placeholder="">
            </div>
            <div class="row">
                <span>Target Market and Size</span>
                <input type="text" placeholder="">
            </div>
            <div class="row">
                <span>Growth Potential</span>
                <input type="text" placeholder="">
            </div>
            <div class="row">
                <span>FRevenue Model</span>
                <input type="text" placeholder="">
            </div>
            <div class="row">
                <span>Stage of startup and future plans</span>
                <input type="text" placeholder="">
            </div>
            <div class="row">
                <span>Team members</span>
                <input type="text" placeholder="">
            </div>
        </div>

        <div class="total">
            <span>Total :</span>
            <input type="text" placeholder="">
        </div>

        <div class="feedback">
            <label for="feedback">Feedback</label>
            <textarea id="feedback" rows="3"></textarea>
        </div>

        <button class="save-btn">Save</button>
    </div>
</body>
</html>
